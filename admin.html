<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JovasDB Admin — Database Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold:#FFD700;--gold2:#E6B800;--gold3:#B8860B;--gold4:#7a5900;
  --black:#000;--dark:#080808;--dark2:#0e0e0e;--dark3:#141414;
  --card:#111;--border:rgba(255,215,0,0.1);--border2:rgba(255,215,0,0.2);
  --text:#e8e8e8;--muted:#666;--muted2:#444;
  --green:#4ADE80;--red:#F87171;--blue:#60A5FA;--cyan:#22D3EE;--orange:#FB923C;
  --font-mono:'JetBrains Mono',monospace;--font-ui:'Syne',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--dark);color:var(--text);font-family:var(--font-ui);display:flex;flex-direction:column;}

/* Topbar */
.topbar{height:52px;background:var(--dark2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.5rem;gap:1rem;flex-shrink:0;}
.topbar-logo{font-family:var(--font-mono);font-size:0.85rem;color:var(--gold);font-weight:500;letter-spacing:0.1em;}
.topbar-sub{font-family:var(--font-mono);font-size:0.65rem;color:var(--muted);letter-spacing:0.15em;}
.topbar-badge{background:rgba(255,215,0,0.1);color:var(--gold3);padding:0.2rem 0.6rem;font-family:var(--font-mono);font-size:0.6rem;border:1px solid var(--border);letter-spacing:0.1em;}
.topbar-right{margin-left:auto;display:flex;gap:0.75rem;align-items:center;}
.topbar-stat{font-family:var(--font-mono);font-size:0.65rem;color:var(--muted);border:1px solid var(--border);padding:0.25rem 0.75rem;}
.btn-sm{padding:0.3rem 0.9rem;font-family:var(--font-mono);font-size:0.65rem;border:1px solid var(--border2);background:transparent;color:var(--gold3);cursor:pointer;letter-spacing:0.1em;transition:all 0.15s;}
.btn-sm:hover{background:rgba(255,215,0,0.08);color:var(--gold);}
.btn-primary-sm{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700;}
.btn-primary-sm:hover{background:#fff;}

/* Layout */
.layout{flex:1;display:grid;grid-template-columns:220px 1fr;overflow:hidden;}

/* Sidebar */
.sidebar{background:var(--dark2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-db{padding:1rem;border-bottom:1px solid var(--border);}
.sidebar-db-name{font-family:var(--font-mono);font-size:0.7rem;color:var(--gold);margin-bottom:0.3rem;}
.sidebar-db-path{font-family:var(--font-mono);font-size:0.6rem;color:var(--muted);}
.sidebar-section{padding:0.6rem 1rem;font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold4);border-bottom:1px solid var(--border);}
.table-list{overflow-y:auto;flex:1;}
.table-item{padding:0.6rem 1rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all 0.15s;border-left:2px solid transparent;}
.table-item:hover{background:rgba(255,215,0,0.04);border-left-color:var(--border);}
.table-item.active{background:rgba(255,215,0,0.06);border-left-color:var(--gold);}
.table-name{font-family:var(--font-mono);font-size:0.72rem;color:var(--muted);}
.table-item.active .table-name{color:var(--gold);}
.table-count{font-family:var(--font-mono);font-size:0.6rem;color:var(--muted2);background:rgba(255,215,0,0.06);padding:0.1rem 0.4rem;}

/* Main content */
.content{display:flex;flex-direction:column;overflow:hidden;}

/* Toolbar */
.toolbar{height:44px;background:var(--dark2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1rem;gap:0.5rem;flex-shrink:0;}
.toolbar-title{font-family:var(--font-mono);font-size:0.75rem;color:var(--gold);font-weight:500;margin-right:0.5rem;}
.toolbar-sep{width:1px;height:20px;background:var(--border);}
.search-input{background:transparent;border:1px solid var(--border);padding:0.3rem 0.75rem;font-family:var(--font-mono);font-size:0.7rem;color:var(--text);outline:none;width:220px;transition:border-color 0.15s;}
.search-input::placeholder{color:var(--muted2);}
.search-input:focus{border-color:rgba(255,215,0,0.3);}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border);flex-shrink:0;}
.stat-card{background:var(--dark3);padding:1rem 1.5rem;}
.stat-label{font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem;}
.stat-value{font-family:var(--font-mono);font-size:1.4rem;font-weight:500;color:var(--gold);}
.stat-sub{font-family:var(--font-mono);font-size:0.6rem;color:var(--muted2);margin-top:0.2rem;}

/* Schema row */
.schema-row{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;}
.schema-col{padding:0.5rem 1rem;font-family:var(--font-mono);font-size:0.62rem;border-right:1px solid var(--border);white-space:nowrap;}
.schema-col-name{color:var(--text);font-weight:500;}
.schema-col-type{color:var(--gold3);}
.schema-col-flags{color:var(--muted2);font-size:0.55rem;margin-top:0.1rem;}

/* Table view */
.table-view{flex:1;overflow:auto;}
table{width:100%;border-collapse:collapse;}
thead{position:sticky;top:0;z-index:10;}
th{background:var(--dark2);padding:0.6rem 1rem;text-align:left;font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold3);border-bottom:1px solid var(--border);white-space:nowrap;font-weight:500;}
td{padding:0.55rem 1rem;border-bottom:1px solid rgba(255,215,0,0.04);font-family:var(--font-mono);font-size:0.72rem;color:var(--muted);white-space:nowrap;transition:background 0.1s;}
tr:hover td{background:rgba(255,215,0,0.025);}
tr.selected td{background:rgba(255,215,0,0.06);}
td.pk{color:var(--gold);font-weight:500;}
td.bool-true{color:var(--green);}
td.bool-false{color:var(--red);}
td.null-val{color:var(--muted2);font-style:italic;}
td.fk{color:var(--blue);}

/* NLQ bar */
.nlq-bar{height:44px;border-top:1px solid var(--border);display:flex;align-items:center;gap:0.75rem;padding:0 1rem;flex-shrink:0;background:var(--dark2);}
.nlq-prefix{font-family:var(--font-mono);font-size:0.65rem;color:var(--gold3);white-space:nowrap;}
.nlq-input{flex:1;background:transparent;border:none;outline:none;font-family:var(--font-mono);font-size:0.75rem;color:var(--text);}
.nlq-input::placeholder{color:var(--muted2);}

/* Status bar */
.status-bar{height:22px;background:#060300;border-top:1px solid var(--border);display:flex;align-items:center;padding:0 1rem;gap:2rem;flex-shrink:0;}
.status-item{font-family:var(--font-mono);font-size:0.58rem;color:var(--gold4);letter-spacing:0.1em;}

/* Row count badge */
.row-count{font-family:var(--font-mono);font-size:0.6rem;color:var(--muted);border:1px solid var(--border);padding:0.15rem 0.5rem;margin-left:auto;}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,215,0,0.1);}
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <span class="topbar-logo">🗄 JovasDB</span>
  <span class="topbar-sub">Admin Dashboard</span>
  <span class="topbar-badge">v1.0.0</span>
  <div class="topbar-right">
    <span class="topbar-stat" id="connStat">● Connected</span>
    <button class="btn-sm" onclick="refresh()">↻ Refresh</button>
    <button class="btn-sm btn-primary-sm" onclick="showInsert()">+ Insert Row</button>
  </div>
</div>

<!-- Layout -->
<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-db">
      <div class="sidebar-db-name" id="dbName">demo_app</div>
      <div class="sidebar-db-path">./jovasdb_data/demo_app.jdb</div>
    </div>
    <div class="sidebar-section">Tables</div>
    <div class="table-list" id="tableList"></div>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Toolbar -->
    <div class="toolbar">
      <span class="toolbar-title" id="currentTable">users</span>
      <div class="toolbar-sep"></div>
      <input class="search-input" id="searchInput" placeholder="Filter rows..." oninput="filterRows()">
      <div class="toolbar-sep"></div>
      <button class="btn-sm" onclick="exportTable()">↓ Export CSV</button>
      <button class="btn-sm" onclick="describeTable()">Schema</button>
      <span class="row-count" id="rowCount">0 rows</span>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="statsRow">
      <div class="stat-card">
        <div class="stat-label">Total Rows</div>
        <div class="stat-value" id="statRows">0</div>
        <div class="stat-sub">in current table</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Columns</div>
        <div class="stat-value" id="statCols">0</div>
        <div class="stat-sub">defined fields</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Indexes</div>
        <div class="stat-value" id="statIdx">0</div>
        <div class="stat-sub">active indexes</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">DB Size</div>
        <div class="stat-value" id="statSize">—</div>
        <div class="stat-sub">on disk</div>
      </div>
    </div>

    <!-- Schema row -->
    <div class="schema-row" id="schemaRow"></div>

    <!-- Table view -->
    <div class="table-view">
      <table id="dataTable">
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- NLQ bar -->
    <div class="nlq-bar">
      <span class="nlq-prefix">🧠 Ask in plain English:</span>
      <input class="nlq-input" id="nlqInput"
        placeholder="find all active users older than 25 · find top 5 orders sort by total desc"
        onkeydown="if(event.key==='Enter') runNLQ()">
      <button class="btn-sm" onclick="runNLQ()">Ask →</button>
    </div>
  </div>
</div>

<!-- Status bar -->
<div class="status-bar">
  <span class="status-item" id="statusMsg">Ready</span>
  <span class="status-item">JovasDB v1.0.0</span>
  <span class="status-item" id="lastQuery"></span>
</div>

<script>
// ── Mock database state ──
const DB = {
  name: "demo_app",
  tables: {
    users: {
      schema: [
        { name:"id",         type:"INTEGER", flags:"PK" },
        { name:"name",       type:"TEXT",    flags:"NOT NULL" },
        { name:"email",      type:"TEXT",    flags:"UNIQUE" },
        { name:"role",       type:"TEXT",    flags:"default=user" },
        { name:"age",        type:"INTEGER", flags:"" },
        { name:"active",     type:"BOOLEAN", flags:"default=true" },
        { name:"created_at", type:"DATETIME",flags:"default=now" },
      ],
      indexes: ["id","email","role","active"],
      rows: [
        { id:1, name:"Alice",   email:"alice@jovas.dev",   role:"admin",     age:28, active:true,  created_at:"2026-01-10" },
        { id:2, name:"Bob",     email:"bob@jovas.dev",     role:"user",      age:34, active:true,  created_at:"2026-02-22" },
        { id:3, name:"Charlie", email:"charlie@jovas.dev", role:"moderator", age:22, active:false, created_at:"2026-03-05" },
        { id:4, name:"Diana",   email:"diana@jovas.dev",   role:"admin",     age:29, active:true,  created_at:"2026-03-19" },
        { id:5, name:"Eve",     email:"eve@jovas.dev",     role:"user",      age:19, active:true,  created_at:"2026-04-30" },
        { id:6, name:"Frank",   email:"frank@jovas.dev",   role:"user",      age:41, active:false, created_at:"2026-05-11" },
      ]
    },
    posts: {
      schema: [
        { name:"id",         type:"INTEGER", flags:"PK" },
        { name:"title",      type:"TEXT",    flags:"NOT NULL" },
        { name:"content",    type:"TEXT",    flags:"" },
        { name:"user_id",    type:"INTEGER", flags:"FK→users.id" },
        { name:"published",  type:"BOOLEAN", flags:"default=false" },
        { name:"created_at", type:"DATETIME",flags:"default=now" },
      ],
      indexes:["id","user_id"],
      rows: [
        { id:1, title:"Hello Jovas",    content:"First post!",       user_id:1, published:true,  created_at:"2026-01-12" },
        { id:2, title:"JovasDB Guide",  content:"How to use JovasDB",user_id:1, published:true,  created_at:"2026-02-01" },
        { id:3, title:"Draft Post",     content:"Work in progress",  user_id:2, published:false, created_at:"2026-03-15" },
        { id:4, title:"AI in Jovas",    content:"Using ai module",   user_id:4, published:true,  created_at:"2026-03-20" },
      ]
    },
    orders: {
      schema: [
        { name:"id",         type:"INTEGER", flags:"PK" },
        { name:"user_id",    type:"INTEGER", flags:"FK→users.id" },
        { name:"total",      type:"FLOAT",   flags:"NOT NULL" },
        { name:"status",     type:"TEXT",    flags:"default=pending" },
        { name:"created_at", type:"DATETIME",flags:"default=now" },
      ],
      indexes:["id","status","user_id"],
      rows: [
        { id:1, user_id:1, total:120.50,  status:"delivered", created_at:"2026-01-15" },
        { id:2, user_id:2, total:89.99,   status:"pending",   created_at:"2026-02-10" },
        { id:3, user_id:1, total:450.00,  status:"delivered", created_at:"2026-03-01" },
        { id:4, user_id:3, total:15.00,   status:"cancelled", created_at:"2026-03-05" },
        { id:5, user_id:5, total:200.75,  status:"pending",   created_at:"2026-04-20" },
        { id:6, user_id:1, total:999.99,  status:"pending",   created_at:"2026-05-01" },
      ]
    },
    products: {
      schema: [
        { name:"id",    type:"INTEGER", flags:"PK" },
        { name:"name",  type:"TEXT",    flags:"NOT NULL" },
        { name:"price", type:"FLOAT",   flags:"NOT NULL" },
        { name:"stock", type:"INTEGER", flags:"default=0" },
        { name:"active",type:"BOOLEAN", flags:"default=true" },
      ],
      indexes:["id"],
      rows: [
        { id:1, name:"Laptop",  price:999.0,  stock:10, active:true  },
        { id:2, name:"Phone",   price:499.0,  stock:25, active:true  },
        { id:3, name:"Tablet",  price:349.0,  stock:0,  active:false },
        { id:4, name:"Monitor", price:250.0,  stock:8,  active:true  },
      ]
    }
  }
};

let currentTable = 'users';
let filteredRows  = [];

// ── Init ──
function init() {
  renderSidebar();
  loadTable('users');
}

function renderSidebar() {
  document.getElementById('dbName').textContent = DB.name;
  const list = document.getElementById('tableList');
  list.innerHTML = '';
  Object.entries(DB.tables).forEach(([name, tbl]) => {
    const el = document.createElement('div');
    el.className = 'table-item' + (name === currentTable ? ' active' : '');
    el.onclick = () => loadTable(name);
    el.innerHTML = `
      <span class="table-name">${name}</span>
      <span class="table-count">${tbl.rows.length}</span>`;
    list.appendChild(el);
  });
}

function loadTable(name) {
  currentTable = name;
  const tbl    = DB.tables[name];
  filteredRows = [...tbl.rows];

  // Update sidebar
  document.querySelectorAll('.table-item').forEach(el => {
    el.classList.toggle('active', el.querySelector('.table-name').textContent === name);
  });

  document.getElementById('currentTable').textContent = name;
  document.getElementById('searchInput').value = '';

  // Stats
  document.getElementById('statRows').textContent = tbl.rows.length;
  document.getElementById('statCols').textContent = tbl.schema.length;
  document.getElementById('statIdx').textContent  = tbl.indexes.length;
  document.getElementById('statSize').textContent = (tbl.rows.length * 0.5).toFixed(1) + ' KB';

  // Schema row
  const sr = document.getElementById('schemaRow');
  sr.innerHTML = tbl.schema.map(col => `
    <div class="schema-col">
      <div class="schema-col-name">${col.name}</div>
      <div class="schema-col-type">${col.type}</div>
      <div class="schema-col-flags">${col.flags}</div>
    </div>`).join('');

  renderTable(filteredRows);
  setStatus(`Loaded '${name}' — ${tbl.rows.length} row(s)`);
}

function renderTable(rows) {
  const tbl    = DB.tables[currentTable];
  const cols   = tbl.schema.map(c => c.name);
  const head   = document.getElementById('tableHead');
  const body   = document.getElementById('tableBody');

  head.innerHTML = '<th style="width:28px;"><input type="checkbox" onchange="toggleAll(this)"></th>' +
    cols.map(c => `<th>${c}</th>`).join('') + '<th>Actions</th>';

  body.innerHTML = rows.map((row, i) => `
    <tr onclick="selectRow(this)">
      <td><input type="checkbox"></td>
      ${cols.map(c => renderCell(c, row[c])).join('')}
      <td>
        <button class="btn-sm" style="padding:0.15rem 0.5rem;font-size:0.58rem;" onclick="editRow(${i})">Edit</button>
        <button class="btn-sm" style="padding:0.15rem 0.5rem;font-size:0.58rem;color:var(--red);border-color:rgba(248,113,113,0.3);" onclick="deleteRow(${i})">Del</button>
      </td>
    </tr>`).join('');

  document.getElementById('rowCount').textContent = `${rows.length} row${rows.length !== 1 ? 's' : ''}`;
}

function renderCell(col, val) {
  if (val === null || val === undefined) return `<td class="null-val">null</td>`;
  if (col === 'id') return `<td class="pk">${val}</td>`;
  if (typeof val === 'boolean') return `<td class="${val ? 'bool-true' : 'bool-false'}">${val}</td>`;
  if (col.endsWith('_id') && col !== 'id') return `<td class="fk">${val}</td>`;
  return `<td>${val}</td>`;
}

function filterRows() {
  const q   = document.getElementById('searchInput').value.toLowerCase();
  const tbl = DB.tables[currentTable];
  filteredRows = q
    ? tbl.rows.filter(row => Object.values(row).some(v => String(v).toLowerCase().includes(q)))
    : [...tbl.rows];
  renderTable(filteredRows);
  setStatus(`Filter: "${q}" → ${filteredRows.length} row(s)`);
}

function runNLQ() {
  const q   = document.getElementById('nlqInput').value.toLowerCase();
  const tbl = DB.tables[currentTable];
  let rows  = [...tbl.rows];
  let sql   = `SELECT * FROM ${currentTable}`;
  const conds = [];

  if (/active/.test(q) && !/inactive/.test(q)) { rows=rows.filter(r=>r.active===true); conds.push('active=true'); }
  if (/inactive/.test(q)) { rows=rows.filter(r=>r.active===false); conds.push('active=false'); }
  for (const role of ['admin','user','moderator']) {
    if (q.includes(role)) { rows=rows.filter(r=>r.role===role); conds.push(`role='${role}'`); }
  }
  for (const s of ['pending','delivered','cancelled']) {
    if (q.includes(s)) { rows=rows.filter(r=>r.status===s); conds.push(`status='${s}'`); }
  }
  const am = q.match(/(older|younger)\s+than\s+(\d+)/);
  if (am) {
    const v=parseInt(am[2]);
    if (am[1]==='older')   { rows=rows.filter(r=>r.age>v);  conds.push(`age>${v}`); }
    else                   { rows=rows.filter(r=>r.age<v);  conds.push(`age<${v}`); }
  }
  const sm = q.match(/sort\s+by\s+(\w+)(\s+desc)?/);
  if (sm) {
    const col=sm[1]; const desc=!!sm[2];
    rows.sort((a,b)=>(desc?-1:1)*((a[col]||0)>(b[col]||0)?1:-1));
    sql += ` ORDER BY ${col}${desc?' DESC':''}`;
  }
  const lm = q.match(/(top|first|limit)\s+(\d+)/);
  if (lm) { rows=rows.slice(0,parseInt(lm[2])); sql+=` LIMIT ${lm[2]}`; }
  if (conds.length) sql += ' WHERE ' + conds.join(' AND ');

  filteredRows = rows;
  renderTable(filteredRows);
  document.getElementById('lastQuery').textContent = sql;
  setStatus(`NLQ: "${q}" → ${rows.length} row(s)`);
}

function selectRow(tr) {
  tr.classList.toggle('selected');
}
function toggleAll(cb) {
  document.querySelectorAll('#tableBody input[type=checkbox]').forEach(c => c.checked = cb.checked);
  document.querySelectorAll('#tableBody tr').forEach(r => r.classList.toggle('selected', cb.checked));
}

function editRow(i) {
  const row = filteredRows[i];
  setStatus(`Editing row: ${JSON.stringify(row).substring(0,60)}...`);
}
function deleteRow(i) {
  if (!confirm('Delete this row?')) return;
  const tbl = DB.tables[currentTable];
  const row = filteredRows[i];
  const idx = tbl.rows.findIndex(r => r.id === row.id);
  if (idx > -1) tbl.rows.splice(idx, 1);
  loadTable(currentTable);
  renderSidebar();
  setStatus(`Deleted row id=${row.id}`);
}

function showInsert() {
  const tbl    = DB.tables[currentTable];
  const fields = tbl.schema.filter(c => !c.flags.includes('PK'));
  const values = {};
  fields.forEach(f => {
    const val = prompt(`${f.name} (${f.type}):`);
    if (val !== null) values[f.name] = val;
  });
  if (Object.keys(values).length) {
    const ids = tbl.rows.map(r => r.id || 0);
    values.id = Math.max(...ids, 0) + 1;
    tbl.rows.push(values);
    loadTable(currentTable);
    renderSidebar();
    setStatus(`Inserted row id=${values.id}`);
  }
}

function describeTable() {
  const tbl  = DB.tables[currentTable];
  const info = tbl.schema.map(c => `${c.name} ${c.type} [${c.flags}]`).join('\n');
  alert(`Table: ${currentTable}\n\n${info}\n\nIndexes: ${tbl.indexes.join(', ')}`);
}

function exportTable() {
  const tbl  = DB.tables[currentTable];
  const cols = tbl.schema.map(c => c.name);
  const csv  = [cols.join(','), ...tbl.rows.map(r => cols.map(c => r[c]).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `${currentTable}.csv`; a.click();
  setStatus(`Exported ${currentTable}.csv`);
}

function refresh() {
  loadTable(currentTable);
  setStatus('Refreshed');
}

function setStatus(msg) {
  document.getElementById('statusMsg').textContent = msg;
}

init();
</script>
</body>
</html>
